name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version: "1.27"

            - name: Check formatting
              run: |
                  unformatted=$(gofmt -l $(git ls-files '*.go'))
                  if [ -n "$unformatted" ]; then
                      echo "The following files are not gofmt'd:"
                      echo "$unformatted"
                      exit 1
                  fi

            - name: Vet
              run: go vet ./...

            - name: Build
              run: go build ./...

            - name: Test
              run: go test ./... -count=1
