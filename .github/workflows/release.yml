name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version: "1.18"
                  cache: true

            - name: Run tests
              run: |
                  go test -v ./tests/...
                  go build -v .

            - name: Run GoReleaser
              uses: goreleaser/goreleaser-action@v7
              with:
                  version: latest
                  args: release --clean
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
